version: '3.8'

services:
  app:
    build: .
    ports:
      - '8000:8000'
    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      DEBUG: ${DEBUG}
      PGHOST: ${PGHOST}
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGSSLMODE: ${PGSSLMODE}
      PGCHANNELBINDING: ${PGCHANNELBINDING}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}
      SCORE_WEIGHT_SALES_VELOCITY: ${SCORE_WEIGHT_SALES_VELOCITY}
      SCORE_WEIGHT_GROWTH: ${SCORE_WEIGHT_GROWTH}
      SCORE_WEIGHT_RATING: ${SCORE_WEIGHT_RATING}
      SCORE_WEIGHT_COMPETITION: ${SCORE_WEIGHT_COMPETITION}
